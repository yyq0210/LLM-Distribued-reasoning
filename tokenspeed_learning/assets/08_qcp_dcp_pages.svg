<text x="1362.0" y="540.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">causal / sparse mask</text>
<line x1="1362" y1="573" x2="1362" y2="615" stroke="#7654C4" stroke-width="3"/>
<polygon points="1362,615 1368.0,602.0 1356.0,602.0" fill="#7654C4"/>
<rect x="1197" y="625" width="330" height="95" rx="16" fill="#FBE1E1" stroke="#14243A" stroke-width="2"/>
<text x="1362.0" y="653.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">局部 O_r + LSE_r</text>
