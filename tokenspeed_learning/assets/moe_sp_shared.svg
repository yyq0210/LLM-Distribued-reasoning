<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
<title>SP：先合并 attention 部分和，再让每个 token 只有一个 owner</title>
<rect width="1600" height="1240" fill="#F5F7FB"/>
<text x="50" y="54" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="42" fill="#14243A">SP：先合并 attention 部分和，再让每个 token 只有一个 owner</text>
<text x="50" y="110" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#52627B">以 attention 副本 A（GPU 0/1）为例；副本 B（GPU 2/3）执行相同步骤</text>
<rect x="320" y="150" width="960" height="85" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="800" y="192" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="28" fill="#14243A">o_proj：GPU 0、GPU 1 各持 P_r=[8,4096]，数值是部分和</text>
<line x1="800" y1="245" x2="417" y2="290" stroke="#2563EB" stroke-width="3"/>
<polygon points="417,290 430.6113325649902,294.4420294691995 429.21104306506743,282.52400994763445" fill="#2563EB"/>
<rect x="60" y="300" width="715" height="230" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<line x1="800" y1="245" x2="1182" y2="290" stroke="#087F79" stroke-width="3"/>
<polygon points="1182,290 1169.7912255294195,282.52030575982536 1168.387320458271,294.4378999193528" fill="#087F79"/>
<rect x="825" y="300" width="715" height="230" rx="16" fill="#FFFFFF" stroke="#087F79" stroke-width="2"/>
<text x="417" y="342" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="31" fill="#2563EB">AllReduce SUM</text>
<text x="417" y="397" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 0：完整 A [8,4096]</text>
<text x="417" y="440" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 1：同一份 A [8,4096]</text>
<text x="417" y="492" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">之后逐行 norm/router 可能重复计算</text>
<text x="1182" y="342" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#087F79">ReduceScatter SUM（沿 token 行）</text>
<text x="1182" y="397" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 0：A_0 [4,4096]，完整数值</text>
<text x="1182" y="440" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 1：A_1 [4,4096]，完整数值</text>
<text x="1182" y="492" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">特征维 H 不变；token 不重复</text>
<text x="800" y="583" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#087F79">采用 RS 后：四卡分别持 A_0、A_1、B_0、B_1，每份 [4,4096]</text>
<line x1="800" y1="610" x2="420" y2="650" stroke="#7654C4" stroke-width="3"/>
<polygon points="420,650 433.5566795950865,654.6061305187939 432.30046218087,642.6720650837369" fill="#7654C4"/>
<line x1="800" y1="610" x2="1180" y2="650" stroke="#B95A11" stroke-width="3"/>
<polygon points="1180,650 1167.69953781913,642.6720650837369 1166.4433204049133,654.6061305187939" fill="#B95A11"/>
<rect x="60" y="665" width="715" height="265" rx="16" fill="#F3EEFC" stroke="#7654C4" stroke-width="2"/>
<rect x="825" y="665" width="715" height="265" rx="16" fill="#FFF4EA" stroke="#B95A11" stroke-width="2"/>
<text x="417" y="710" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="30" fill="#7654C4">路由专家分支：EP4</text>
<text x="417" y="764" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#14243A">采用前图任一正确的 dispatch / combine</text>
<text x="417" y="817" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">每卡返回自身 token 的结果</text>
<text x="417" y="878" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="30" fill="#7654C4">Y_routed=[4,4096]</text>
<text x="1182" y="710" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="30" fill="#B95A11">共享专家分支：本例 TP2</text>
<text x="1182" y="764" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">组内 AG：每卡恢复 [8,4096]</text>
<text x="1182" y="817" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">Column → 激活 → Row → 组内 RS</text>
<text x="1182" y="878" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="30" fill="#B95A11">Y_shared=[4,4096]</text>
<line x1="417" y1="942" x2="800" y2="985" stroke="#7654C4" stroke-width="3"/>
<polygon points="800,985 787.7505887798635,977.5870434535204 786.4117418852246,989.5121216080952" fill="#7654C4"/>
<line x1="1182" y1="942" x2="800" y2="985" stroke="#B95A11" stroke-width="3"/>
<polygon points="800,985 813.58956712513,989.5081776087003 812.2472591931684,977.5834885387163" fill="#B95A11"/>
<rect x="290" y="995" width="1020" height="78" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="800" y="1034" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#14243A">相同 token 顺序逐元素相加 → Y=[4,4096]</text>
<line x1="800" y1="1082" x2="800" y2="1120" stroke="#52627B" stroke-width="3"/>
<polygon points="800,1120 806.0,1107.0 794.0,1107.0" fill="#52627B"/>
<text x="800" y="1150" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">下一次普通 head-TP attention 前，按需在 TP2 组内 AG 回 [8,4096]</text>
<text x="50" y="1210" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">SP 减少部分重复激活/计算；不自动减少专家 GEMM，也不意味着通信从此消失。</text>
</svg>
