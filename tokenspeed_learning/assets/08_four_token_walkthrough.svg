<text x="385.0" y="1152.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">[4,4096] → P0 [4,5120] 部分和</text>
<rect x="100" y="1340" width="570" height="115" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="385.0" y="1374.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">⑥ ReduceScatter 后的完整输出</text>
<text x="385.0" y="1426.25" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">t0、t1：Y [2,5120]</text>
