<text x="50" y="1555" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="25" fill="#53647B">这是逻辑分组示意：CPU 上计算了分组；未启动 8 卡服务，也未验证跨机通信。</text>
