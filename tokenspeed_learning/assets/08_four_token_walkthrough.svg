<polygon points="1215,644 1221.0,631.0 1209.0,631.0" fill="#52627B"/>
<text x="800" y="1230" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">ReduceScatter：相同 token 的 P0 + P1，再按 token 分给 owner</text>
<line x1="385" y1="1265" x2="1215" y2="1265" stroke="#2563EB" stroke-width="3"/>
<polygon points="1215,1265 1202.0,1259.0 1202.0,1271.0" fill="#2563EB"/>
<line x1="1215" y1="1287" x2="385" y2="1287" stroke="#087F79" stroke-width="3"/>
<polygon points="385,1287 398.0,1293.0 398.0,1281.0" fill="#087F79"/>
<line x1="385" y1="1300" x2="385" y2="1334" stroke="#52627B" stroke-width="3"/>
<polygon points="385,1334 391.0,1321.0 379.0,1321.0" fill="#52627B"/>
<line x1="1215" y1="1300" x2="1215" y2="1334" stroke="#52627B" stroke-width="3"/>
<polygon points="1215,1334 1221.0,1321.0 1209.0,1321.0" fill="#52627B"/>
<text x="800" y="1510" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">追踪 t3：GPU1 做小投影 → 两卡各算一半 heads → 两份输出贡献汇到 GPU1</text>
<text x="50" y="1575" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#52627B">①② 按 token 分工（SP）；④⑤ 按 heads / 权重分工（TP）；⑥ 回到按 token 分工。</text>
<text x="50" y="1625" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">两卡看到完整可见 KV，所以这里没有跨卡 LSE 合并。不是多两张卡，也不是切开 hidden 特征做 Norm。</text>
</svg>
