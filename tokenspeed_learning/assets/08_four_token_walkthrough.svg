<text x="1215.0" y="424.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#087F79">② 本地 Norm + Q down + SWA KV</text>
<text x="1215.0" y="482.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">Cq [2,1280]；KV [2,512]</text>
<rect x="930" y="650" width="570" height="115" rx="16" fill="#FFFFFF" stroke="#087F79" stroke-width="2"/>
<text x="1215.0" y="684.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#087F79">③ 收齐 4 个 latent，尚未生成 Q heads</text>
<text x="1215.0" y="736.25" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">Cq [4,1280]；KV [4,512]</text>
<line x1="1215" y1="773" x2="1215" y2="825" stroke="#087F79" stroke-width="3"/>
<polygon points="1215,825 1221.0,812.0 1209.0,812.0" fill="#087F79"/>
<rect x="930" y="835" width="570" height="140" rx="16" fill="#FBE1E1" stroke="#087F79" stroke-width="2"/>
<text x="1215.0" y="877.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#087F79">④ Q up → 本地 heads 的 Attention</text>
<text x="1215.0" y="940.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">Q / O [4,32,512]；读本请求可见 KV</text>
<line x1="1215" y1="983" x2="1215" y2="1030" stroke="#087F79" stroke-width="3"/>
<polygon points="1215,1030 1221.0,1017.0 1209.0,1017.0" fill="#087F79"/>
<rect x="930" y="1040" width="570" height="150" rx="16" fill="#EDE6F8" stroke="#087F79" stroke-width="2"/>
<text x="1215.0" y="1085.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#087F79">⑤ 4 组 wo_a → 本地 wo_b</text>
<text x="1215.0" y="1152.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">[4,4096] → P1 [4,5120] 部分和</text>
<rect x="930" y="1340" width="570" height="115" rx="16" fill="#FFFFFF" stroke="#087F79" stroke-width="2"/>
<text x="1215.0" y="1374.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#087F79">⑥ ReduceScatter 后的完整输出</text>
<text x="1215.0" y="1426.25" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">t2、t3：Y [2,5120]</text>
<text x="800" y="558" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="28" fill="#14243A">AllGather：每卡把自己的 2 行小 latent 发给对方</text>
<line x1="385" y1="590" x2="1215" y2="590" stroke="#2563EB" stroke-width="3"/>
<polygon points="1215,590 1202.0,584.0 1202.0,596.0" fill="#2563EB"/>
