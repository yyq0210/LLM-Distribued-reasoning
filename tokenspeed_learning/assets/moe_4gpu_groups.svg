<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>MoE 并行：同一组 4 张 GPU，按计算阶段改变分工</title>
<rect width="1600" height="1000" fill="#F5F7FB"/>
<text x="50" y="54" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="42" fill="#14243A">MoE 并行：同一组 4 张 GPU，按计算阶段改变分工</text>
<text x="50" y="112" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#52627B">示例：16 个独立 token · H=4096 · 8 个路由专家 · Top-2 · BF16</text>
<rect x="50" y="160" width="725" height="290" rx="16" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
<text x="412" y="200" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">Attention 副本 0：TP=2，处理 A 的 8 个 token</text>
<rect x="70" y="235" width="335" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="237" y="270" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="32" fill="#2563EB">GPU 0</text>
<text x="237" y="315" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">Q heads 0–15</text>
<text x="237" y="355" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">KV heads 0–3</text>
<text x="237" y="390" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">o_proj 部分和 [8,4096]</text>
<rect x="420" y="235" width="335" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="587" y="270" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="32" fill="#2563EB">GPU 1</text>
<text x="587" y="315" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">Q heads 16–31</text>
<text x="587" y="355" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">KV heads 4–7</text>
<text x="587" y="390" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">o_proj 部分和 [8,4096]</text>
<rect x="825" y="160" width="725" height="290" rx="16" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
<text x="1187" y="200" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">Attention 副本 1：TP=2，处理 B 的 8 个 token</text>
<rect x="845" y="235" width="335" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1012" y="270" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="32" fill="#2563EB">GPU 2</text>
<text x="1012" y="315" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">Q heads 0–15</text>
<text x="1012" y="355" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">KV heads 0–3</text>
<text x="1012" y="390" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">o_proj 部分和 [8,4096]</text>
<rect x="1195" y="235" width="335" height="180" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1362" y="270" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="32" fill="#2563EB">GPU 3</text>
<text x="1362" y="315" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">Q heads 16–31</text>
<text x="1362" y="355" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">KV heads 4–7</text>
<text x="1362" y="390" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">o_proj 部分和 [8,4096]</text>
<text x="800" y="493" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">输入 X：GPU 0/1 持有 A；GPU 2/3 持有 B。每份 X 都是 [8,4096]。</text>
<line x1="800" y1="520" x2="800" y2="565" stroke="#52627B" stroke-width="3"/>
<polygon points="800,565 806.0,552.0 794.0,552.0" fill="#52627B"/>
<rect x="50" y="580" width="1500" height="235" rx="16" fill="#F3EEFC" stroke="#7654C4" stroke-width="2"/>
<text x="800" y="622" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#7654C4">路由专家：EP=4，expert TP=1；同一专家集合跨越两个 attention 副本</text>
<rect x="75" y="665" width="340" height="115" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="245" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#7654C4">GPU 0：E0、E1</text>
<text x="245" y="746" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">每个专家权重完整存放</text>
<rect x="445" y="665" width="340" height="115" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="615" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#7654C4">GPU 1：E2、E3</text>
<text x="615" y="746" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">每个专家权重完整存放</text>
<rect x="815" y="665" width="340" height="115" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="985" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#7654C4">GPU 2：E4、E5</text>
<text x="985" y="746" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">每个专家权重完整存放</text>
<rect x="1185" y="665" width="340" height="115" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1355" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="29" fill="#7654C4">GPU 3：E6、E7</text>
<text x="1355" y="746" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="24" fill="#52627B">每个专家权重完整存放</text>
<text x="800" y="860" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#087F79">共享专家分支：本例按 (0,1)、(2,3) 做 TP=2；所有 token 都执行。</text>
<text x="800" y="907" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="28" fill="#14243A">4 = attention DP2 × TP2 = routed EP4 × expert TP1；不是 2 × 2 × 4。</text>
<text x="50" y="963" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">教学布局，未启动四卡服务。共享专家是否存在、采用何种分组，取决于模型和后端。</text>
</svg>
