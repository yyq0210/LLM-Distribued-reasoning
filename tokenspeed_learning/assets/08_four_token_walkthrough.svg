<text x="1215.0" y="300.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">t2、t3：X [2,5120]</text>
<line x1="1215" y1="333" x2="1215" y2="375" stroke="#087F79" stroke-width="3"/>
<polygon points="1215,375 1221.0,362.0 1209.0,362.0" fill="#087F79"/>
