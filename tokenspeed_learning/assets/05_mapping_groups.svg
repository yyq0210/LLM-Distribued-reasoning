<line x1="765" y1="440" x2="835" y2="440" stroke="#C65A13" stroke-width="4"/>
<polygon points="835,440 822.0,433.0 822.0,447.0" fill="#C65A13"/>
<text x="800" y="408" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="24" fill="#C65A13">PP</text>
<text x="800" y="649" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="28" fill="#C65A13">阶段间对应位置传递激活： 0 → 4   1 → 5   2 → 6   3 → 7</text>
<text x="800" y="684" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="23" fill="#53647B">虚线表示 DP 分组关系，不表示推理时要做梯度同步。</text>
<rect x="30" y="730" width="1540" height="310" rx="16" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="60" y="773" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="31" fill="#16243A">② MoE：同一批 rank，每阶段改为 TP = 1，EP = 4，DP = 1</text>
<text x="60" y="815" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="25" fill="#53647B">每个阶段的专家集合分布在 4 个 rank 上；没有新增 GPU。</text>
