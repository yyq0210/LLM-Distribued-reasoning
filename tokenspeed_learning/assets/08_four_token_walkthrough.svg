<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1690" viewBox="0 0 1600 1690">
<title>走一遍：4 个 token，在 2 张 GPU 上完成一次 Attention</title>
<rect width="1600" height="1690" fill="#F5F7FB"/>
<text x="50" y="54" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="42" fill="#14243A">走一遍：4 个 token，在 2 张 GPU 上完成一次 Attention</text>
<text x="50" y="111" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="25" fill="#52627B">V4.1 维度 · 一个请求 · 无历史前缀 · 选纯 SWA 层 · 教学 SP → head TP → SP 布局</text>
<text x="385" y="182" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="30" fill="#2563EB">GPU 0：负责 heads 0–31</text>
<text x="1215" y="182" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="30" fill="#087F79">GPU 1：负责 heads 32–63</text>
<rect x="100" y="225" width="570" height="100" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="385.0" y="255.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">① 已归约的完整 token 行</text>
<text x="385.0" y="300.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">t0、t1：X [2,5120]</text>
<line x1="385" y1="333" x2="385" y2="375" stroke="#2563EB" stroke-width="3"/>
<polygon points="385,375 391.0,362.0 379.0,362.0" fill="#2563EB"/>
<rect x="100" y="385" width="570" height="130" rx="16" fill="#FFF0CC" stroke="#2563EB" stroke-width="2"/>
<text x="385.0" y="424.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">② 本地 Norm + Q down + SWA KV</text>
<text x="385.0" y="482.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">Cq [2,1280]；KV [2,512]</text>
<rect x="100" y="650" width="570" height="115" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="385.0" y="684.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">③ 收齐 4 个 latent，尚未生成 Q heads</text>
<text x="385.0" y="736.25" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">Cq [4,1280]；KV [4,512]</text>
<line x1="385" y1="773" x2="385" y2="825" stroke="#2563EB" stroke-width="3"/>
<polygon points="385,825 391.0,812.0 379.0,812.0" fill="#2563EB"/>
<rect x="100" y="835" width="570" height="140" rx="16" fill="#FBE1E1" stroke="#2563EB" stroke-width="2"/>
<text x="385.0" y="877.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#2563EB">④ Q up → 本地 heads 的 Attention</text>
<text x="385.0" y="940.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">Q / O [4,32,512]；读本请求可见 KV</text>
<line x1="385" y1="983" x2="385" y2="1030" stroke="#2563EB" stroke-width="3"/>
<polygon points="385,1030 391.0,1017.0 379.0,1017.0" fill="#2563EB"/>
