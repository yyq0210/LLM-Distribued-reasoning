<text x="1012.0" y="377.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">每行带原始 position</text>
<line x1="1012" y1="407" x2="1012" y2="455" stroke="#7654C4" stroke-width="3"/>
