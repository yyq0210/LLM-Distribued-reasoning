<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<title>TokenSpeed 八个 rank 的 TP DP PP EP 分组</title>
<desc>两个 PP 阶段，每阶段 attention TP2 DP2，MoE EP4。底部展示 rank 0 的四种组关系。</desc>
<rect width="1600" height="1600" fill="#F5F7FB"/>
<text x="50" y="55" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="43" fill="#16243A">8 个 rank，按层采用不同的并行分工</text>
<text x="50" y="110" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="26" fill="#53647B">world = 8   ·   PP = 2   ·   每阶段 4 个 rank   ·   分组来自实际 Mapping 输出</text>
<rect x="30" y="150" width="1540" height="555" rx="16" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="60" y="190" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="32" fill="#16243A">① Attention / Dense：每阶段 TP = 2，DP = 2</text>
<text x="60" y="233" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="25" fill="#53647B">蓝色横排是 attention 副本；绿色虚线连接不同副本中相同 TP 位置的进程。</text>
<rect x="60" y="270" width="690" height="340" rx="16" fill="#F8FAFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="405" y="298" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="27" fill="#16243A">PP 阶段 0：rank 0–3</text>
