<text x="1187" y="772" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="25" fill="#7654C4">按 LSE 权重合并同一个 Q 的结果</text>
<rect x="50" y="860" width="1500" height="320" rx="16" fill="#FFFFFF" stroke="#087F79" stroke-width="2"/>
<text x="800" y="905" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="28" fill="#087F79">KVP4 示例：一个请求的 8 个逻辑 page，page p 属于 GPU (p mod 4)</text>
<rect x="65" y="955" width="350" height="100" rx="16" fill="#FFFFFF" stroke="#14243A" stroke-width="2"/>
<text x="240.0" y="985.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 0：page 0, 4</text>
<text x="240.0" y="1030.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">自己的本地物理 slots</text>
<rect x="435" y="955" width="350" height="100" rx="16" fill="#FFFFFF" stroke="#14243A" stroke-width="2"/>
<text x="610.0" y="985.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 1：page 1, 5</text>
<text x="610.0" y="1030.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">自己的本地物理 slots</text>
<rect x="805" y="955" width="350" height="100" rx="16" fill="#FFFFFF" stroke="#14243A" stroke-width="2"/>
<text x="980.0" y="985.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 2：page 2, 6</text>
<text x="980.0" y="1030.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">自己的本地物理 slots</text>
<rect x="1175" y="955" width="350" height="100" rx="16" fill="#FFFFFF" stroke="#14243A" stroke-width="2"/>
<text x="1350.0" y="985.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="27" fill="#14243A">GPU 3：page 3, 7</text>
<text x="1350.0" y="1030.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">自己的本地物理 slots</text>
<text x="800" y="1100" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="28" fill="#14243A">查询表保存 owner + local slot；请求、逻辑位置和 prefix 身份保持一致</text>
<text x="800" y="1145" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="25" fill="#52627B">V4.1：global KV / index-K 可分片；SWA、compressor tails 等仍有复制部分</text>
<text x="50" y="1225" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#14243A">DCP 的同一贡献只计一次：复制的 SWA 指定一个 owner，attention sink 也只能计一次。</text>
<text x="50" y="1280" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="25" fill="#14243A">分布式 Top-k 仍要选全局的目标集合；不能每卡随意少选一些，然后指望 LSE 恢复遗漏。</text>
<text x="50" y="1335" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="25" fill="#52627B">CP 会增加数据交换；更大 KV 容量与更低 decode 延迟是两个不同目标。</text>
</svg>
