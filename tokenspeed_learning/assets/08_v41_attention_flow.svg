<text x="50" y="1670" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">权重按数学 XW 方向标注，PyTorch 存储通常转置。global 分支仅示意依赖，非完整 CED 图。</text>
<text x="50" y="1715" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#52627B">KV 选择还依赖 X、q latent；图中省略这两条侧向线。量化尺度、Engram、视觉及 DSpark 未展开。</text>
