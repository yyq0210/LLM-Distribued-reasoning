<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390">
<title>优化三：QCP 切 query 工作；KVP + DCP 切历史 KV</title>
<rect width="1600" height="1390" fill="#F5F7FB"/>
<text x="50" y="54" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="42" fill="#14243A">优化三：QCP 切 query 工作；KVP + DCP 切历史 KV</text>
<text x="50" y="110" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC,sans-serif" font-size="26" fill="#52627B">固定同一请求、相同 query head；左侧按 query 行分工，右侧对同一行合并 KV 分片结果</text>
